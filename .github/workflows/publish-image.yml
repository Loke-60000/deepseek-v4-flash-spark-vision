name: publish image

# Builds the runnable image and pushes it to GHCR so it can be pulled instead of
# built. The base is arm64 and about 21.7 GB extracted, so disk is the binding
# constraint. ubuntu-24.04-arm is free on public repos and starts with roughly
# 25-30 GB free; the cleanup step below recovers more. If the build still runs
# out of space, set runner_label to a self-hosted arm64 machine, which can be
# registered with --ephemeral so it deregisters itself after one job.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: runner to build on
        default: ubuntu-24.04-arm
      plugin_ref:
        description: FlyCockpit plugin ref
        default: main
      tag:
        description: extra tag alongside latest
        default: ""
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner_label || 'ubuntu-24.04-arm' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase; the owner is Loke-60000.
      - name: Resolve image name
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/deepseek-v4-flash-spark-vision" >> "$GITHUB_ENV"
          echo "image: ghcr.io/$owner/deepseek-v4-flash-spark-vision"

      - name: Free disk
        run: |
          echo "before:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/share/chromium /usr/local/lib/node_modules \
                      /opt/hostedtoolcache "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo apt-get clean 2>/dev/null || true
          docker system prune -af --volumes 2>/dev/null || true
          echo "after:"; df -h / | tail -1
          avail=$(df --output=avail -BG / | tail -1 | tr -dc '0-9')
          echo "available: ${avail}G"
          if [ "${avail:-0}" -lt 30 ]; then
            echo "Under 30G free and the base image is 21.7G extracted; this build may fail on disk." >&2
          fi

      - name: Check architecture
        run: |
          arch=$(uname -m)
          echo "runner arch: $arch"
          if [ "$arch" != "aarch64" ] && [ "$arch" != "arm64" ]; then
            echo "The base image is arm64 only (GB10). This runner is $arch." >&2
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build \
            --build-arg PLUGIN_REF="${{ github.event.inputs.plugin_ref || 'main' }}" \
            -t "$IMAGE:latest" .
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            docker tag "$IMAGE:latest" "$IMAGE:${{ github.event.inputs.tag }}"
          fi
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            docker tag "$IMAGE:latest" "$IMAGE:${GITHUB_REF_NAME}"
          fi

      - name: Push
        run: docker push --all-tags "$IMAGE"

      - name: Report
        run: |
          echo "pulled with: docker pull $IMAGE:latest" >> $GITHUB_STEP_SUMMARY
          docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.Size}}' >> $GITHUB_STEP_SUMMARY
