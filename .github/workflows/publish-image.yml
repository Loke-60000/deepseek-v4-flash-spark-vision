name: publish image

# Builds the runnable image and pushes it to GHCR so it can be pulled instead of
# built. The base is arm64 and about 21.7 GB, so the job needs an arm64 runner
# with real disk. GitHub's hosted ubuntu-24.04-arm has roughly 14 GB free before
# the cleanup step below, which is why runner_label defaults to a self-hosted
# machine. Set it to ubuntu-24.04-arm to try a hosted build.

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: runner to build on
        default: self-hosted
      plugin_ref:
        description: FlyCockpit plugin ref
        default: main
      tag:
        description: extra tag alongside latest
        default: ""
  push:
    tags:
      - "v*"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/deepseek-v4-flash-spark-vision

jobs:
  build:
    runs-on: ${{ github.event.inputs.runner_label || 'self-hosted' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          docker image prune -af 2>/dev/null || true
          df -h / | tail -1

      - name: Check architecture
        run: |
          arch=$(uname -m)
          echo "runner arch: $arch"
          if [ "$arch" != "aarch64" ] && [ "$arch" != "arm64" ]; then
            echo "The base image is arm64 only (GB10). This runner is $arch." >&2
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build \
            --build-arg PLUGIN_REF="${{ github.event.inputs.plugin_ref || 'main' }}" \
            -t "$IMAGE:latest" .
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            docker tag "$IMAGE:latest" "$IMAGE:${{ github.event.inputs.tag }}"
          fi
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            docker tag "$IMAGE:latest" "$IMAGE:${GITHUB_REF_NAME}"
          fi

      - name: Push
        run: docker push --all-tags "$IMAGE"

      - name: Report
        run: |
          echo "pulled with: docker pull $IMAGE:latest" >> $GITHUB_STEP_SUMMARY
          docker images "$IMAGE" --format '{{.Repository}}:{{.Tag}} {{.Size}}' >> $GITHUB_STEP_SUMMARY
